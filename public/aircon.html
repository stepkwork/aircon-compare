  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
:root[data-theme="light"] .admin-tabs.is-scrolled .admin-tab-list {
  background: rgba(255, 255, 255, 0.98);
  border-color: #cbd2dc;
}
:root[data-theme="light"] .admin-modal {
  background-color: rgba(255, 255, 255, 0.96);
}
:root[data-theme="light"] .admin-modal,
:root[data-theme="light"] .admin-section,

/* Structured model specification form */
.spec-editor{padding:20px;background:var(--hdr);border-radius:18px}
.spec-editor-head{margin-bottom:6px}
.spec-form-sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.spec-section{min-width:0;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 5px 18px rgba(32,24,28,.045)}
.spec-section h5{margin:0 0 14px;font-size:.78rem;text-transform:uppercase;letter-spacing:.075em;color:var(--accent)}
.spec-section-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.spec-field{min-width:0}.spec-field.wide{grid-column:1/-1}
.spec-field .admin-field{font-size:.78rem;font-weight:600;color:var(--fg);margin-bottom:6px}
.spec-field .required-mark{color:var(--accent);margin-left:3px}
.spec-field input,.spec-field select{margin:0!important;min-height:42px;border-radius:10px!important}
.spec-input-group{display:flex;min-width:0}.spec-input-group input{flex:1;border-radius:10px 0 0 10px!important}.spec-input-group select{width:auto;min-width:78px;max-width:112px;border-radius:0 10px 10px 0!important;border-left:0!important}
.spec-dimensions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;align-items:center}
.spec-dimensions input{min-width:0;text-align:center}.spec-dimensions select{width:auto;min-width:68px}
.spec-power{display:grid;grid-template-columns:1.5fr .8fr .6fr;gap:8px}.spec-power label,.spec-dimensions label{display:block;font-size:.7rem;color:var(--muted);margin:0 0 4px}
.spec-error{display:block;color:#b4233c;font-size:.72rem;margin-top:5px}.spec-field [aria-invalid=true]{border-color:#ff0000!important;box-shadow:0 0 0 2px rgba(255,0,0,.12)!important}
.spec-feature-list{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 9px}.spec-feature-chip{border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);padding:6px 10px;font-size:.76rem}.spec-feature-chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.spec-add-feature{display:flex;gap:7px}.spec-add-feature input{flex:1}
.spec-savebar{position:sticky;bottom:-1px;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px -20px -20px;padding:12px 20px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-radius:0 0 18px 18px}
@media(max-width:700px){.spec-form-sections{grid-template-columns:1fr}.spec-editor{padding:14px}.spec-savebar{margin:14px -14px -14px;padding-inline:14px}.spec-section{padding:13px}}
@media(max-width:380px){.spec-section-fields{grid-template-columns:1fr}.spec-field.wide{grid-column:auto}.spec-dimensions{grid-template-columns:repeat(3,minmax(0,1fr))}.spec-dimensions select{grid-column:1/-1;width:100%}}

/* Admin form rhythm + matching picker */
.admin-brand-block{margin-bottom:16px}
.admin-modal .row{align-items:stretch;gap:10px}
.admin-modal .row input,
.admin-modal .row button.primary{height:44px;min-height:44px;margin:0;box-sizing:border-box;border-radius:10px}
.admin-modal .row button.primary{display:flex;align-items:center;justify-content:center;padding:0 16px;font-weight:600}
.admin-modal .model-select-wrap,.admin-modal .model-select{max-width:none;width:100%}
.admin-modal .model-select{height:44px;min-height:44px;padding:0 34px 0 12px;border-radius:10px;font-size:.9rem;display:flex;align-items:center}
.model-picker-shell{z-index:220}
.model-picker-list{padding:6px;gap:4px}
.model-picker-option{display:flex;align-items:center;width:100%;min-height:40px;margin:0;padding:8px 12px;border:1px solid transparent;border-radius:10px!important;text-align:left;box-sizing:border-box}
.model-picker-option+.model-picker-option{border-top-color:transparent}
.model-picker-option{flex:0 0 auto;height:auto;white-space:normal;overflow-wrap:anywhere;line-height:1.35;font-size:.9rem}
.model-picker-option:hover,.model-picker-option:focus-visible{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:var(--accent)!important;outline:none}
.model-picker-option[aria-selected=true]{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:var(--accent)!important;font-weight:600;box-shadow:none}

.admin-fields{margin-top:18px}
.admin-add-model{display:flex;gap:10px;align-items:center;margin-top:12px}
.admin-add-model input{flex:1;min-width:0;margin:0;height:44px}
.admin-add-model .model-select-wrap{flex:0 0 128px;width:128px;min-width:128px}
.admin-add-model .model-select{height:44px}
.admin-add-model button{flex:0 0 auto;height:44px;min-width:110px;margin:0;white-space:nowrap}
.spec-input-group{gap:10px;align-items:center}
.spec-input-group input{flex:1;min-width:0;border-radius:10px!important;height:44px}
.spec-input-group .model-select-wrap{flex:0 0 120px;width:120px;min-width:120px}
.spec-input-group .model-select{height:44px;border-radius:10px!important}
.spec-dimensions{gap:10px}
.spec-dimensions .model-select-wrap{min-width:88px;width:88px}

.admin-fields{align-items:start}
.admin-fields>div{min-width:0}

}


function seriesForFilter(brand, invFilter){
  var m=M[brand];
  if(!m||!m.series) return [];
  return m.series.filter(function(s){
    var isInv = s.inv !== false; // default true
    if(invFilter===true) return isInv;
    if(invFilter===false) return !isInv;
    return true;
  });
}
function brandHasInvMatch(brand, invFilter){
  if(invFilter==null) return true;
  return seriesForFilter(brand, invFilter).length > 0;

function supportsHp(d,hp){
  if(hp==null) return true;
  return d.lo<=hp && d.hi>=hp;
}
function firstModelAtHp(brand,hp){
  var m=M[brand];
  if(!m||!m.series) return html`<span class="no-model">—</span>`;
  for(var i=0;i<m.series.length;i++){
    var models=m.series[i].models||[];
    for(var j=0;j<models.length;j++){
      if(models[j].hp===hp){

        var label=(x.in||x.code||"")+(x.out?" / "+x.out:"");
        if(x.c==="v") return html`<span class="mc">${label}</span>`;
        return html`<span class="mc u">${label} ?</span>`;
      }
    }
  }
  return html`<span class="no-model">—</span>`;
}

async function persistAdminData(nextBrands,nextModels,nextSpecs){
  if(!dataReady) throw new Error("Saved Cloudflare data is not ready; reload the page before editing.");
  var payload={brands:nextBrands,models:nextModels,specData:nextSpecs};
  var serializedPayload=JSON.stringify(payload);
  var response=await fetch("/api/admin/data",{
    method:"PUT",
    headers:{"content-type":"application/json"},
    body:serializedPayload
  });
  var result={};
  var responseText=await response.text();
  try{
    result=responseText?JSON.parse(responseText):{};
  }catch(_err){
    throw new Error("Cloudflare returned an invalid save response ("+response.status+")");
  }
  if(!response.ok) throw new Error(result.error||"Cloudflare save failed ("+response.status+")");
  if(result.saved!==true) throw new Error("Cloudflare did not confirm that the comparison data was saved.");
  var verifyResponse=await fetch("/api/data",{cache:"no-store"});
  if(!verifyResponse.ok) throw new Error("Cloudflare accepted the save but could not verify it ("+verifyResponse.status+").");
  var savedData=await verifyResponse.json();
  if(JSON.stringify(savedData)!==serializedPayload) throw new Error("Cloudflare did not return the saved comparison data. Please reload and try again.");
  setAdminNotice("");
}

  },[]);

    if(!open||!portalTarget) return;

      var below=window.innerHeight-rect.bottom-8,above=rect.top-8;
      var placeAbove=below<160&&above>below;
      var available=placeAbove?above:below;
      var maxHeight=Math.max(80,Math.min(280,available));
      var width=Math.min(rect.width,window.innerWidth-16);
      var left=Math.max(8,Math.min(rect.left,window.innerWidth-width-8));

    else if(event.key==="ArrowUp"){event.preventDefault();moveTo(index-1);}
    else if(event.key==="Home"){event.preventDefault();moveTo(0);}
    else if(event.key==="End"){event.preventDefault();moveTo(props.options.length-1);}
    else if(event.key==="Escape"){event.preventDefault();setOpen(false);if(triggerRef.current)triggerRef.current.focus();}
    else if(event.key==="Tab"){setOpen(false);}

function loadPdfJs(){
  return new Promise(function(resolve,reject){
    function ready(){
      var lib=window.pdfjsLib;
      if(!lib){return false}
      if(!lib.GlobalWorkerOptions.workerSrc&&!lib.GlobalWorkerOptions.workerPort){
        fetch(PDFJS_BASE+"pdf.worker.min.js").then(function(r){return r.text()}).then(function(code){
          lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:"text/javascript"}));resolve(lib);
        }).catch(function(){lib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+"pdf.worker.min.js";resolve(lib)});
      }else resolve(lib);
      return true;
    }
    if(ready())return;
    var tag=document.createElement("script");tag.src=PDFJS_BASE+"pdf.min.js";
    tag.onerror=function(){reject(new Error("The PDF reader could not be loaded. Check your connection, or upload a screenshot instead."))};
    tag.onload=function(){var tries=0;(function wait(){if(ready())return;if(++tries>50)return reject(new Error("The PDF reader could not be loaded."));setTimeout(wait,100)})()};
    document.head.appendChild(tag);
  });
}
async function pdfToInput(file){
  var lib=await loadPdfJs();
  var pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  var pages=Math.min(pdf.numPages,8),chunks=[];
  for(var n=1;n<=pages;n++){
    var content=await (await pdf.getPage(n)).getTextContent(),rows=[];
    content.items.forEach(function(item){
      if(!item.str||!item.str.trim())return;
      var y=item.transform[5],x=item.transform[4],row=rows.find(function(r){return Math.abs(r.y-y)<3});
      if(!row){row={y:y,items:[]};rows.push(row)}
      row.items.push({x:x,w:item.width||0,str:item.str.trim()});
    });
    rows.sort(function(a,b){return b.y-a.y});
    chunks.push(rows.map(function(row){
      row.items.sort(function(a,b){return a.x-b.x});
      return row.items.reduce(function(line,item,i){
        if(!i)return item.str;
        var prev=row.items[i-1];return line+(item.x-(prev.x+prev.w)>8?" | ":" ")+item.str;
      },"");
    }).join("\n"));
  }
  var text=chunks.join("\n\n").trim();
  logAuto("PDF: "+pdf.numPages+" page(s), "+text.replace(/\s/g,"").length+" characters of selectable text"+(text.replace(/[\s|]/g,"").length>=80?"":" (too little, so it will be read as images)"));
  var hasText=text.replace(/[\s|]/g,"").length>=80;
  // Renders pages (top and bottom halves, so small print stays legible) for image reading.
  function imageSlices(){
    var slices=[];
    for(var n=1;n<=Math.min(pdf.numPages,3);n++){(function(pageNo){
      ["top","bottom"].forEach(function(part){
        slices.push({label:"page "+pageNo+" ("+part+")",render:async function(){
          var page=await pdf.getPage(pageNo),base=page.getViewport({scale:1}),scale=1700/base.width;
          var viewport=page.getViewport({scale:scale}),full=document.createElement("canvas");
          full.width=Math.round(viewport.width);full.height=Math.round(viewport.height);
          var fctx=full.getContext("2d");fctx.fillStyle="#fff";fctx.fillRect(0,0,full.width,full.height);
          await page.render({canvasContext:fctx,viewport:viewport}).promise;
          var half=Math.round(full.height*0.55),y=part==="top"?0:full.height-half;
          var out=document.createElement("canvas");out.width=full.width;out.height=half;
          out.getContext("2d").drawImage(full,0,y,full.width,half,0,0,full.width,half);
          var url=out.toDataURL("image/jpeg",0.88);
          return {file:{mime:"image/jpeg",data:url.slice(url.indexOf(",")+1)}};
        }});
      });
    })(n)}
    return slices;
  }
  return {text:hasText?text.slice(0,30000):"",slices:imageSlices()};
}
async function runPdfSlices(slices){
  for(var i=0;i<slices.length;i++){
    var payload=await slices[i].render();
    var out=await runAutofillRequest(payload,"Reading "+slices[i].label+" as an image ("+(i+1)+" of "+slices.length+")…");
    if(out.ok)return;
    if(out.status!==422)return;
  }
}
function autofillFromFile(file){
  if(!file)return;
  setAutoLog([]);logAuto("File: "+file.name+" ("+Math.round(file.size/1024)+" KB, "+(file.type||"unknown type")+")");
  var isPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name||"");
  var allowed=["image/jpeg","image/png","image/webp"];
  if(!isPdf&&allowed.indexOf(file.type)<0){setAutoMsg({ok:false,text:"Upload a JPG, PNG or WebP image, or a PDF.",warnings:[]});return}
  if(file.size>(isPdf?15:5)*1024*1024){setAutoMsg({ok:false,text:"That file is over "+(isPdf?15:5)+" MB. Use a smaller file.",warnings:[]});return}
  if(isPdf){
    setAutoBusy(true);setAutoMsg({ok:true,text:"Reading the PDF…",warnings:[]});
    pdfToInput(file).then(async function(input){
      if(input.text){var out=await runAutofillRequest({text:input.text});if(out.ok||out.status!==422)return}
      await runPdfSlices(input.slices);
    }).catch(function(error){setAutoBusy(false);setAutoMsg({ok:false,text:(error&&error.message)||"The PDF could not be read.",warnings:[]})});
    return;
  }
  var reader=new FileReader();
  reader.onload=function(){var text=String(reader.result||"");runAutofillRequest({file:{mime:file.type,data:text.slice(text.indexOf(",")+1)}})};
  reader.onerror=function(){setAutoMsg({ok:false,text:"The file could not be read.",warnings:[]})};
  reader.readAsDataURL(file);
}
