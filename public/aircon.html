function modelCode(x){
  if(!x) return html`<span class="no-model">—</span>`;
  if(x[1]==="v") return html`<span class="mc">${x[0]}</span>`;
  return html`<span class="mc u">${x[0]} ?</span>`;
}


function seriesForFilter(brand, invFilter){
  var m=M[brand];
  if(!m||!m.series) return [];
  return m.series.filter(function(s){
    var isInv = s.inv !== false; // default true
    if(invFilter===true) return isInv;
    if(invFilter===false) return !isInv;
    return true;
  });
}
function brandHasInvMatch(brand, invFilter){
  if(invFilter==null) return true;
  return seriesForFilter(brand, invFilter).length > 0;
}

function supportsHp(d,hp){
  if(hp==null) return true;
  return d.lo<=hp && d.hi>=hp;
}
function firstModelAtHp(brand,hp){
  var m=M[brand];
  if(!m||!m.series) return html`<span class="no-model">—</span>`;
  for(var i=0;i<m.series.length;i++){
    var models=m.series[i].models||[];
    for(var j=0;j<models.length;j++){
      if(models[j].hp===hp){
        var x=models[j];
        var label=(x.in||x.code||"")+(x.out?" / "+x.out:"");
        if(x.c==="v") return html`<span class="mc">${label}</span>`;
        return html`<span class="mc u">${label} ?</span>`;
      }
    }
  }
  return html`<span class="no-model">—</span>`;
}

async function translateBrandField(sourceKey,targetKey,setBusy,setMessage,successMessage){
  setBusy(true);setMessage("");

    var response=await fetch("/api/admin/translate",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({text:adminBrandForm[sourceKey]||""})
    });
    var responseText=await response.text(),result={};
    try{result=responseText?JSON.parse(responseText):{}}catch(_err){throw new Error("Translation service returned an invalid response ("+response.status+")")}
    if(!response.ok) throw new Error(result.error||"Translation failed ("+response.status+")");
    if(typeof result.translation!=="string"||!result.translation.trim()) throw new Error("Translation service returned an empty translation");
    setAdminBrandForm(function(current){return Object.assign({},current,{[targetKey]:result.translation})});
    setMessage(successMessage);
  }catch(err){
    setMessage(err.message||"Translation failed. Please try again.");
  }finally{
    setBusy(false);
  }
}
async function persistAdminData(nextBrands,nextModels,nextSpecs){
  if(!dataReady) throw new Error("Saved Cloudflare data is not ready; reload the page before editing.");
  var payload={brands:nextBrands,models:nextModels,specData:nextSpecs};
  var serializedPayload=JSON.stringify(payload);
  var response=await fetch("/api/admin/data",{
    method:"PUT",
    headers:{"content-type":"application/json"},
    body:serializedPayload
  });
  var result={};
  var responseText=await response.text();
  try{
    result=responseText?JSON.parse(responseText):{};
  }catch(_err){
    throw new Error("Cloudflare returned an invalid save response ("+response.status+")");
  }
  if(!response.ok) throw new Error(result.error||"Cloudflare save failed ("+response.status+")");
  if(result.saved!==true) throw new Error("Cloudflare did not confirm that the comparison data was saved.");
  var verifyResponse=await fetch("/api/data",{cache:"no-store"});
  if(!verifyResponse.ok) throw new Error("Cloudflare accepted the save but could not verify it ("+verifyResponse.status+").");
  var savedData=await verifyResponse.json();
  if(JSON.stringify(savedData)!==serializedPayload) throw new Error("Cloudflare did not return the saved comparison data. Please reload and try again.");
  setAdminNotice("");
}

function getLeaderFlags(metrics,highIsBetter){

  ${SpecInput("cspf","CSPF")}
  ${SpecInput("stars","Energy rating (2-5 stars)",{type:"number",min:2,max:5,step:1})}
  ${SpecChoice("priceRange",t.priceRange,[{value:"budget",label:t.budget},{value:"mid",label:t.midRange},{value:"premium",label:t.premium}])}
  ${SpecChoice("wifi",t.wifi,[{value:"yes",label:t.invYes},{value:"no",label:t.invNo}])}
  ${SpecChoice("selfCleaning",t.selfCleaning,[{value:"yes",label:t.invYes},{value:"no",label:t.invNo}])}
  ${SpecChoice("airPurification",t.airPurification,[{value:"yes",label:t.invYes},{value:"no",label:t.invNo}])}
  ${SpecInput("current","Running current (A)")}
  ${SpecInput("power","Power supply")}
  ${SpecInput("ref","Refrigerant")}
  ${SpecInput("liq","Pipe liquid (mm)")}
  ${SpecInput("gas","Pipe gas (mm)")}
  ${SpecInput("iaf","Indoor airflow")}
  ${SpecInput("inoise","Indoor noise")}
  ${SpecInput("idim","Indoor dimensions (W×D×H)")}
  ${SpecInput("iwt","Indoor weight (kg)")}
  ${SpecInput("oaf","Outdoor airflow")}
  ${SpecInput("onoise","Outdoor noise")}
  ${SpecInput("odim","Outdoor dimensions")}
  ${SpecInput("owt","Outdoor weight (kg)")}
  ${SpecInput("plen","Maximum pipe length (m)")}
  ${SpecInput("ph","Maximum pipe height (m)")}
  ${SpecInput("gasAmt","Refrigerant amount (g)")}
</div>`}
</div>
<div class="row" style=${{marginTop:"12px"}}>
<button type="button" class="primary" onClick=${function(){
  var code=(adminForm.code||"").trim();
  if(!code){alert("Model code required");return;}
  var nextSpecs=Object.assign({},SPECDATA);
  nextSpecs[code]=Object.assign({},adminForm);
  delete nextSpecs[code].code;
  SPECDATA=nextSpecs;
  setSpecData(nextSpecs);
  setAdminForm({});
  setAdminEdit("");
  persistAdminData(brandsData,modelsData,nextSpecs).then(function(){
    alert("Saved to Cloudflare: "+code);
  }).catch(function(err){
    alert("Changes are only in this page and could not be saved to Cloudflare: "+err.message);
  });
}}>Save Model</button>
${adminEdit?html`<button type="button" onClick=${function(){
  if(confirm("Delete "+adminEdit+" from series and specs?")){
    var nextSpecs=Object.assign({},SPECDATA);
    delete nextSpecs[adminEdit];
    var next=JSON.parse(JSON.stringify(modelsData));
    if(adminBrand&&adminSeries&&next[adminBrand]){
      var series=next[adminBrand].series.find(function(s){return s.nEn===adminSeries});
      if(series) series.models=series.models.filter(function(m){return m.in!==adminEdit});
    }
    SPECDATA=nextSpecs;setSpecData(nextSpecs);
    commitModels(next);
    setAdminForm({});setAdminEdit("");setAdminSeries("");setAdminBrand("");
    persistAdminData(brandsData,next,nextSpecs).then(function(){
      alert("Deleted and saved to Cloudflare");
    }).catch(function(err){
      alert("Deleted in this page but could not save to Cloudflare: "+err.message);
    });
  }
}}>Delete Model</button>`:null}
</div>
`:html`<p>Select a brand and series to edit model specifications.</p>`}
</section>`:null}
${adminTab==="modelTable"?html`<section class="admin-section">
<h3>${t.modelTable}</h3>
<p>Browse every catalog model and its simple comparison details. Use Edit to open a model in the specification editor.</p>
<div class="spec-table-note">
  <input type="search" placeholder="Search brand, series, or model" aria-label="Search model table" value=${modelTableSearch} onInput=${function(e){setModelTableSearch(e.target.value)}} />
  <span>${t.modelsFound(visibleModelRows.length)}</span>
</div>
<div class="card"><div class="scroll"><table class="model-admin-table">
<thead><tr>
  <th>${t.brand}</th><th>${t.series}</th><th>${t.product}</th><th>${t.hpLabel}</th>
  <th>${t.inverterType}</th><th>${t.priceRange}</th><th>${t.energyRating}</th>
  <th>${t.wifi}</th><th>${t.selfCleaning}</th><th>${t.airPurification}</th><th></th>
</tr></thead>
<tbody>${visibleModelRows.length?visibleModelRows.map(function(row){
  return html`<tr key=${row.brand+"-"+row.code}>
    <td>${row.brand}</td><td>${row.series}</td><td><span class="mc">${row.code}</span>${row.out?html`<span class="series-note">${row.out}</span>`:null}</td>
    <td>${row.hp} HP</td><td>${row.inverter}</td><td>${row.price}</td><td>${row.stars}</td>
    <td>${row.wifi}</td><td>${row.selfCleaning}</td><td>${row.airPurification}</td>
    <td><button type="button" onClick=${function(){
      var selected=SPECDATA[row.code]||{};
      setAdminBrand(row.brand);setAdminSeries(row.series);setAdminEdit(row.code);
      setAdminForm(Object.assign({},selected,{code:row.code}));setSpecEditorMode("simple");setAdminTab("models");
    }}>${t.editModel}</button></td>
  </tr>`;
}):html`<tr><td colspan="11" class="empty">${t.empty}</td></tr>`}</tbody>
</table></div></div>
</section>`:null}
<div class="row">
<button type="button" onClick=${async function(){
  try{
    var response=await fetch("/api/admin/logout",{method:"POST"});
    if(!response.ok) throw new Error("Logout failed ("+response.status+")");
    setAdminAuth(false);setShowAdmin(false);
  }catch(err){
    alert("Could not log out: "+err.message);
  }
}}>Logout</button>
</div>
`}
</div>
</div>`:null}
</div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script></body></html>
